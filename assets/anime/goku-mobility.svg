<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="zenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b1e"/>
      <stop offset="100%" stop-color="#050c0e"/>
    </linearGradient>
    <linearGradient id="zenAura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="giOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd5b0"/>
      <stop offset="100%" stop-color="#e09f67"/>
    </linearGradient>
    <filter id="zenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="620" fill="url(#zenBg)"/>

  <!-- Concentric Lotus Ki Rings -->
  <circle cx="250" cy="360" r="160" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" stroke-dasharray="10 8"/>
  <circle cx="250" cy="360" r="120" fill="none" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <ellipse cx="250" cy="360" rx="140" ry="170" fill="url(#zenAura)" filter="url(#zenGlow)"/>

  <!-- Lotus Meditation Pose -->
  <g id="zen_meditation">
    <path d="M 250,110 C 235,70 200,45 170,55 C 190,85 205,115 210,140 C 180,140 160,160 150,180 C 190,180 210,195 225,210 Z" fill="#0f172a"/>
    <path d="M 250,110 C 265,70 300,45 330,55 C 310,85 295,115 290,140 C 320,140 340,160 350,180 C 310,180 290,195 275,210 Z" fill="#0f172a"/>

    <!-- Peaceful Meditating Face -->
    <polygon points="220,150 280,150 268,200 250,215 232,200" fill="url(#skin)"/>
    <line x1="230" y1="172" x2="242" y2="172" stroke="#111" stroke-width="2.5"/>
    <line x1="258" y1="172" x2="270" y2="172" stroke="#111" stroke-width="2.5"/>
    <path d="M 244" y1="195" x2="256" y2="195" stroke="#9a3412" stroke-width="2"/>

    <!-- Upright Zen Posture -->
    <polygon points="205,215 295,215 315,330 185,330" fill="url(#giOrange)"/>
    <polygon points="230,215 270,215 250,270" fill="#1d4ed8"/>

    <!-- Resting Hands on Knees (Mudras) -->
    <path d="M 195,230 L 130,300 L 160,340" stroke="url(#skin)" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M 305,230 L 370,300 L 340,340" stroke="url(#skin)" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Folded Crossed Legs -->
    <ellipse cx="250" cy="370" rx="140" ry="45" fill="url(#giOrange)"/>
    <circle cx="160" cy="350" r="14" fill="url(#skin)"/>
    <circle cx="340" cy="350" r="14" fill="url(#skin)"/>
  </g>
</svg>