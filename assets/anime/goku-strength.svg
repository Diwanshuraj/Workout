<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="strengthBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1608"/>
      <stop offset="60%" stop-color="#141006"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <linearGradient id="ssjAura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ssjHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="giOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe3c7"/>
      <stop offset="100%" stop-color="#e69c5e"/>
    </linearGradient>
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="620" fill="url(#strengthBg)"/>
  
  <!-- Super Saiyan Aura Flame Flares -->
  <polygon points="250,30 200,280 300,280" fill="url(#ssjAura)" filter="url(#superGlow)"/>
  <ellipse cx="250" cy="320" rx="170" ry="230" fill="url(#ssjAura)" filter="url(#superGlow)"/>

  <!-- Olympic Squat Rack Pillars -->
  <rect x="80" y="80" width="18" height="420" fill="#334155" stroke="#1e293b"/>
  <rect x="402" y="80" width="18" height="420" fill="#334155" stroke="#1e293b"/>

  <!-- Character Back/Shoulders with Barbell in Squat -->
  <g id="ssj_squat">
    <!-- Golden Spiky Super Saiyan Hair -->
    <path d="M 250,50 
             C 230,20 190,-10 160,-20 C 185,15 200,45 205,75 
             C 170,40 135,35 105,45 C 135,75 160,100 170,130
             C 130,125 110,145 95,170 C 135,165 160,180 180,200
             C 195,130 230,85 250,50 Z" fill="url(#ssjHair)" filter="url(#superGlow)"/>
    <path d="M 250,50 
             C 270,20 310,-10 340,-20 C 315,15 300,45 295,75 
             C 330,40 365,35 395,45 C 365,75 340,100 330,130
             C 370,125 390,145 405,170 C 365,165 340,180 320,200
             C 305,130 270,85 250,50 Z" fill="url(#ssjHair)" filter="url(#superGlow)"/>
    <path d="M 220,60 C 240,30 260,30 280,60 C 270,95 230,95 220,60 Z" fill="#fef9c3"/>

    <!-- Head & Super Saiyan Green/Cyan Eyes -->
    <polygon points="215,140 285,140 270,195 250,215 230,195" fill="url(#skin)"/>
    <polygon points="230,152 245,150 242,158 232,158" fill="#111"/>
    <polygon points="255,150 270,152 268,158 258,158" fill="#111"/>
    <circle cx="238" cy="154" r="3" fill="#22d3ee"/>
    <circle cx="262" cy="154" r="3" fill="#22d3ee"/>
    <line x1="242" y1="185" x2="258" y2="185" stroke="#111" stroke-width="3.5"/>

    <!-- Huge Traps & Barbell along Shoulders -->
    <polygon points="180,210 320,210 345,290 155,290" fill="url(#skin)"/>

    <!-- Massive Barbell Across Traps -->
    <rect x="20" y="210" width="460" height="14" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <!-- 4 Heavy Plates Each Side -->
    <rect x="40" y="140" width="22" height="160" rx="5" fill="#f36100"/>
    <rect x="25" y="155" width="18" height="130" rx="4" fill="#0f172a"/>
    <rect x="438" y="140" width="22" height="160" rx="5" fill="#f36100"/>
    <rect x="457" y="155" width="18" height="130" rx="4" fill="#0f172a"/>

    <!-- Deep Squat Torso & Legs -->
    <polygon points="190,290 310,290 330,390 170,390" fill="url(#giOrange)"/>
    <rect x="175" y="380" width="150" height="24" rx="4" fill="#1d4ed8"/>
    <!-- Powerful Squat Quads -->
    <path d="M 175,400 L 120,490 L 195,500 L 235,420 Z" fill="url(#giOrange)"/>
    <path d="M 325,400 L 380,490 L 305,500 L 265,420 Z" fill="url(#giOrange)"/>
    <polygon points="110,490 190,490 175,540 100,540" fill="#1d4ed8"/>
    <polygon points="310,490 390,490 400,540 325,540" fill="#1d4ed8"/>
  </g>
</svg>