<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%">
  <defs>
    <linearGradient id="cardioBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="speedTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f36100" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f36100" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="giOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd5b0"/>
      <stop offset="100%" stop-color="#e09f67"/>
    </linearGradient>
  </defs>

  <rect width="500" height="620" fill="url(#cardioBg)"/>

  <!-- Speed Lines / Wind trails -->
  <line x1="20" y1="180" x2="180" y2="180" stroke="url(#speedTrail)" stroke-width="4"/>
  <line x1="50" y1="240" x2="220" y2="240" stroke="url(#speedTrail)" stroke-width="5"/>
  <line x1="10" y1="320" x2="200" y2="320" stroke="url(#speedTrail)" stroke-width="3"/>
  <line x1="40" y1="400" x2="250" y2="400" stroke="url(#speedTrail)" stroke-width="6"/>
  <line x1="80" y1="480" x2="240" y2="480" stroke="url(#speedTrail)" stroke-width="4"/>

  <!-- Athletic Forward Sprint Pose -->
  <g id="cardio_runner" transform="translate(40, 20)">
    <!-- Hair flying back with momentum -->
    <path d="M 230,120 C 180,80 120,90 70,110 C 110,130 150,140 180,150 Z" fill="#0f172a"/>
    <path d="M 240,110 C 200,60 140,65 90,80 C 130,105 170,120 200,135 Z" fill="#0f172a"/>
    <circle cx="245" cy="155" r="28" fill="url(#skin)"/>

    <!-- Dynamic Pumping Sprint Arms -->
    <path d="M 220,180 L 150,220 L 130,180" stroke="url(#skin)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M 260,180 L 330,230 L 360,200" stroke="url(#skin)" stroke-width="26" stroke-linecap="round" fill="none"/>

    <!-- Angled Sprint Torso -->
    <polygon points="210,180 280,175 310,290 230,295" fill="url(#giOrange)"/>

    <!-- Sprinting Legs: One High Knee Drive, One Stride Extension -->
    <path d="M 280,290 L 360,340 L 320,440" stroke="url(#giOrange)" stroke-width="42" stroke-linecap="round" fill="none"/>
    <path d="M 230,295 L 140,360 L 90,470" stroke="url(#giOrange)" stroke-width="42" stroke-linecap="round" fill="none"/>

    <circle cx="320" cy="455" r="20" fill="#1d4ed8"/>
    <circle cx="90" cy="485" r="20" fill="#1d4ed8"/>
  </g>
</svg>